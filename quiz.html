    <h1>Quick Quiz</h1>
    <p>Test what you've learned so far!</p>

    <div class="quiz-box">
        <p><strong>1. Which tag creates a link?</strong></p>
        <button onclick="checkAnswer(1, 'a')">&lt;a&gt;</button>
        <button onclick="checkAnswer(1, 'p')">&lt;p&gt;</button>
        <button onclick="checkAnswer(1, 'div')">&lt;div&gt;</button>
    </div>
    <p id="result1"></p>

    <div class="quiz-box">
        <p><strong>2. Which property changes text color in CSS?</strong></p>
        <button onclick="checkAnswer(2, 'color')">color</button>
        <button onclick="checkAnswer(2, 'background')">background</button>
        <button onclick="checkAnswer(2, 'font')">font</button>
    </div>
    <p id="result2"></p>

    <div class="quiz-box">
        <p><strong>3. Which keyword declares a variable in JavaScript?</strong></p>
        <button onclick="checkAnswer(3, 'let')">let</button>
        <button onclick="checkAnswer(3, 'tag')">tag</button>
        <button onclick="checkAnswer(3, 'style')">style</button>
    </div>

    <p id="result3"></p>
    <div class="quiz-box">
    <p><strong>4. Which keyword prints output in C++?</strong></p>
    <button onclick="checkAnswer(4, 'cout')">cout</button>
    <button onclick="checkAnswer(4, 'cin')">cin</button>
    <button onclick="checkAnswer(4, 'print')">print</button>
</div>
<p id="result4"></p>
